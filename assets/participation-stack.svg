<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" role="img" aria-labelledby="title desc">
  <title id="title">The participation stack</title>
  <desc id="desc">Live Match Events lead to Match Context Signals, AI Interpretation Layer, Prediction Windows, Fan Decisions, and Leaderboard, Identity and Reputation.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink { fill: #24292f; }
    .muted { fill: #656d76; }
    .rule { stroke: #afb8c1; fill: none; }
    .frame { stroke: #d0d7de; fill: none; }
    .arrow { fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .muted { fill: #9da7b3; }
      .rule { stroke: #6e7681; }
      .frame { stroke: #3d444d; }
      .arrow { fill: #9da7b3; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7 Z" class="arrow"/></marker></defs>
