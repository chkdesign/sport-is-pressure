  <rect x="24" y="64" width="592" height="68" class="frame" stroke-width="1.25"/>
  <text x="46" y="107" font-size="18" class="muted" font-weight="500" text-anchor="start">01</text>
  <text x="90" y="109" font-size="29" class="ink" font-weight="500" text-anchor="start">Live Match Events</text>
  <path d="M320 137 V150" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="24" y="154" width="592" height="68" class="frame" stroke-width="1.25"/>
  <text x="46" y="197" font-size="18" class="muted" font-weight="500" text-anchor="start">02</text>
  <text x="90" y="199" font-size="29" class="ink" font-weight="500" text-anchor="start">Match Context Signals</text>
  <path d="M320 227 V240" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="24" y="244" width="592" height="68" class="frame" stroke-width="1.25"/>
  <text x="46" y="287" font-size="18" class="muted" font-weight="500" text-anchor="start">03</text>
  <text x="90" y="289" font-size="29" class="ink" font-weight="500" text-anchor="start">AI Interpretation Layer</text>
  <path d="M320 317 V330" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="24" y="334" width="592" height="68" class="frame" stroke-width="1.25"/>
  <text x="46" y="377" font-size="18" class="muted" font-weight="500" text-anchor="start">04</text>
  <text x="90" y="379" font-size="29" class="ink" font-weight="500" text-anchor="start">Prediction Windows</text>
  <path d="M320 407 V420" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="24" y="424" width="592" height="68" class="frame" stroke-width="1.25"/>
  <text x="46" y="467" font-size="18" class="muted" font-weight="500" text-anchor="start">05</text>
  <text x="90" y="469" font-size="29" class="ink" font-weight="500" text-anchor="start">Fan Decisions</text>
  <path d="M320 497 V510" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="24" y="514" width="592" height="68" class="frame" stroke-width="1.25"/>
  <text x="46" y="557" font-size="18" class="muted" font-weight="500" text-anchor="start">06</text>
  <text x="90" y="543" font-size="28" class="ink" font-weight="500" text-anchor="start">Leaderboard, Identity</text>
  <text x="90" y="572" font-size="28" class="ink" font-weight="500" text-anchor="start">&amp; Reputation</text>
