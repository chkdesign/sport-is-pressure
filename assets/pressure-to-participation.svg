<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" role="img" aria-labelledby="title desc">
  <title id="title">The core equation</title>
  <desc id="desc">Sport = pressure. Pressure = anticipation. Anticipation = prediction. Prediction = the participation layer. A conceptual equation from Sport Is Pressure.</desc>
  <rect width="640" height="620" fill="#171717"/>
  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
    <text x="40" y="43" font-size="16" fill="#b7b7b1" font-weight="500" text-anchor="start" letter-spacing="2">THE CORE EQUATION</text>
    <path d="M40 66 H600" stroke="#474743" stroke-width="1"/>
    <text x="320" y="125" font-size="44" fill="#f5f5f0" font-weight="600" text-anchor="middle" letter-spacing="1">SPORT</text>
    <text x="320" y="170" font-size="30" fill="#979791" font-weight="400" text-anchor="middle">=</text>
    <text x="320" y="222" font-size="44" fill="#f5f5f0" font-weight="600" text-anchor="middle" letter-spacing="1">PRESSURE</text>
    <text x="320" y="267" font-size="30" fill="#979791" font-weight="400" text-anchor="middle">=</text>
    <text x="320" y="319" font-size="44" fill="#f5f5f0" font-weight="600" text-anchor="middle" letter-spacing="1">ANTICIPATION</text>
    <text x="320" y="364" font-size="30" fill="#979791" font-weight="400" text-anchor="middle">=</text>
    <text x="320" y="416" font-size="44" fill="#f5f5f0" font-weight="600" text-anchor="middle" letter-spacing="1">PREDICTION</text>
    <text x="320" y="461" font-size="30" fill="#979791" font-weight="400" text-anchor="middle">=</text>
    <text x="320" y="516" font-size="36" fill="#f5f5f0" font-weight="600" text-anchor="middle" letter-spacing="0.5">THE PARTICIPATION</text>
    <text x="320" y="561" font-size="36" fill="#f5f5f0" font-weight="600" text-anchor="middle" letter-spacing="0.5">LAYER</text>
  </g>
</svg>
