<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 584" width="600" height="584" role="img" aria-labelledby="title desc">
  <title id="title">The core equation</title>
  <desc id="desc">Sport = pressure. Pressure = anticipation. Anticipation = prediction. Prediction = the participation layer.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink { fill: #24292f; }
    .muted { fill: #656d76; }
    .rule { stroke: #afb8c1; fill: none; }
    .frame { stroke: #d0d7de; fill: none; }
    .arrow { fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .muted { fill: #9da7b3; }
      .rule { stroke: #6e7681; }
      .frame { stroke: #3d444d; }
      .arrow { fill: #9da7b3; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7 Z" class="arrow"/></marker></defs>
  <text x="24" y="35" font-size="19" class="muted" font-weight="500" text-anchor="start" letter-spacing="1.8">THE CORE EQUATION</text>
  <path d="M24 58 H576" class="frame" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="120" font-size="40" class="ink" font-weight="600" text-anchor="middle">SPORT</text>
  <text x="300" y="168" font-size="28" class="muted" font-weight="400" text-anchor="middle">=</text>
  <text x="300" y="218" font-size="40" class="ink" font-weight="600" text-anchor="middle">PRESSURE</text>
  <text x="300" y="266" font-size="28" class="muted" font-weight="400" text-anchor="middle">=</text>
  <text x="300" y="316" font-size="40" class="ink" font-weight="600" text-anchor="middle">ANTICIPATION</text>
  <text x="300" y="364" font-size="28" class="muted" font-weight="400" text-anchor="middle">=</text>
  <text x="300" y="414" font-size="40" class="ink" font-weight="600" text-anchor="middle">PREDICTION</text>
  <text x="300" y="462" font-size="28" class="muted" font-weight="400" text-anchor="middle">=</text>
  <text x="300" y="512" font-size="34" class="ink" font-weight="600" text-anchor="middle">THE PARTICIPATION</text>
  <text x="300" y="552" font-size="34" class="ink" font-weight="600" text-anchor="middle">LAYER</text>
</svg>
