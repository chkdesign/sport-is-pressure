<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="title desc">
  <title id="title">The fan participation loop</title>
  <desc id="desc">The five stages in order: Anticipation, Prediction, Commitment, Reaction, Reputation. A return path connects Reputation back to Anticipation.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink { fill: #24292f; }
    .muted { fill: #656d76; }
    .rule { stroke: #afb8c1; fill: none; }
    .frame { stroke: #d0d7de; fill: none; }
    .arrow { fill: #656d76; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .muted { fill: #9da7b3; }
      .rule { stroke: #6e7681; }
      .frame { stroke: #3d444d; }
      .arrow { fill: #9da7b3; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7 Z" class="arrow"/></marker></defs>
  <text x="120" y="65" font-size="17" class="muted" font-weight="500" text-anchor="middle">01</text>
  <text x="120" y="111" font-size="30" class="ink" font-weight="600" text-anchor="middle">Anticipation</text>
  <text x="360" y="65" font-size="17" class="muted" font-weight="500" text-anchor="middle">02</text>
  <text x="360" y="111" font-size="30" class="ink" font-weight="600" text-anchor="middle">Prediction</text>
  <text x="600" y="65" font-size="17" class="muted" font-weight="500" text-anchor="middle">03</text>
  <text x="600" y="111" font-size="30" class="ink" font-weight="600" text-anchor="middle">Commitment</text>
  <text x="840" y="65" font-size="17" class="muted" font-weight="500" text-anchor="middle">04</text>
  <text x="840" y="111" font-size="30" class="ink" font-weight="600" text-anchor="middle">Reaction</text>
  <text x="1080" y="65" font-size="17" class="muted" font-weight="500" text-anchor="middle">05</text>
  <text x="1080" y="111" font-size="30" class="ink" font-weight="600" text-anchor="middle">Reputation</text>
  <path d="M219 101 H259" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M459 101 H499" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M699 101 H739" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M939 101 H979" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M1080 143 V192 Q1080 218 1054 218 H146 Q120 218 120 192 V143" class="rule" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
